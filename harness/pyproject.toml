[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trend-ai-harness"
version = "1.0.0"
description = "트랜드AI — Harness 구조 뉴스 분석 파이프라인"
requires-python = ">=3.11"
dependencies = [
    # 수집
    "requests>=2.32",
    "feedparser>=6.0",        # ai-news-dashboard RSS 파싱용
    # AI
    "anthropic>=0.40",
    "openai>=1.50",           # ai-news-dashboard 호환용 (선택적)
    # DB
    "supabase>=2.0",
    # UI
    "streamlit>=1.35",
    "pandas>=2.0",
    # 설정
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[project.scripts]
trend-ai = "cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
