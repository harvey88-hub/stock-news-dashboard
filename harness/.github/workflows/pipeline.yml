name: 트랜드AI Harness 파이프라인

on:
  schedule:
    # 매시간 뉴스 수집 + 분석 (KST 기준 매시간 0분)
    - cron: "0 * * * *"
    # 일간 KRX 종목 업데이트 (KST 06:00 = UTC 21:00 전날)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      pipeline:
        description: "실행할 파이프라인"
        required: true
        default: "hourly-news"
        type: choice
        options:
          - hourly-news
          - daily-stocks
      dry_run:
        description: "Dry-run (저장 없이 시뮬레이션)"
        required: false
        default: false
        type: boolean

jobs:
  # ────────────────────────────────────────
  # 매시간: 뉴스 수집 + AI 분석
  # ────────────────────────────────────────
  hourly-news:
    name: "뉴스 수집 + AI 분석"
    runs-on: ubuntu-latest
    # cron "0 * * * *" 또는 수동으로 hourly-news 선택 시 실행
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 * * * *' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'hourly-news'
    defaults:
      run:
        working-directory: harness

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "harness/pyproject.toml"

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: 뉴스 수집 + 분석 파이프라인 실행
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DRY_RUN=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="--dry-run"
          fi
          python cli.py pipeline hourly-news $DRY_RUN

  # ────────────────────────────────────────
  # 일간: KRX 종목 업데이트
  # ────────────────────────────────────────
  daily-stocks:
    name: "KRX 종목 업데이트"
    runs-on: ubuntu-latest
    # cron "0 21 * * *" 또는 수동으로 daily-stocks 선택 시 실행
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 21 * * *' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'daily-stocks'
    defaults:
      run:
        working-directory: harness

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "harness/pyproject.toml"

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: KRX 종목 업데이트 파이프라인 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KRX_API_KEY:  ${{ secrets.KRX_API_KEY }}
        run: |
          DRY_RUN=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="--dry-run"
          fi
          python cli.py pipeline daily-stocks $DRY_RUN
