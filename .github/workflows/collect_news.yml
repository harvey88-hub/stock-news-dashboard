name: 트랜드AI Harness 파이프라인

on:
  schedule:
    - cron: "0 * * * *"      # 매시간 뉴스 수집 + AI 분석
    - cron: "0 21 * * *"     # 매일 06:00 KST (UTC 21:00) 상장 종목 업데이트
  workflow_dispatch:
    inputs:
      pipeline:
        description: "실행할 파이프라인"
        required: true
        default: "hourly-news"
        type: choice
        options:
          - hourly-news
          - daily-stocks
      dry_run:
        description: "Dry-run (저장 없이 시뮬레이션)"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [cron-trigger]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────
  # 매시간: 뉴스 수집 + AI 분석
  # ────────────────────────────────────────
  hourly-news:
    name: "뉴스 수집 + AI 분석"
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 * * * *' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'hourly-news')

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "harness/pyproject.toml"

      - name: 의존성 설치
        run: pip install requests supabase anthropic pyyaml

      - name: 뉴스 수집 + 분석 파이프라인
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DRY_RUN=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="--dry-run"
          fi
          python harness/cli.py pipeline hourly-news $DRY_RUN

  # ────────────────────────────────────────
  # 일간: KRX 종목 업데이트
  # ────────────────────────────────────────
  daily-stocks:
    name: "KRX 종목 업데이트"
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 21 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'daily-stocks')

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "harness/pyproject.toml"

      - name: 의존성 설치
        run: pip install requests supabase pyyaml

      - name: KRX 종목 업데이트 파이프라인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KRX_API_KEY:  ${{ secrets.KRX_API_KEY }}
        run: |
          DRY_RUN=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="--dry-run"
          fi
          python harness/cli.py pipeline daily-stocks $DRY_RUN
